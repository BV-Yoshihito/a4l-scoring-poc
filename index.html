<!-- iPhoneで「ホーム画面に追加」したときにブラウザUIなしの全画面で開く（球場での実地テスト用） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>
/* ============================================================
   A4L ワンオペ入力PoC — A4Lブランド準拠デザイン
   参照: https://www.a4l.group/ のCSS実測値と実画面
     モノクローム基調（#000 / #FFF / #8F8F8F / #E2E2E2 / #6E6E6D / #2F2E2E）
     アクセント = ヒーロー画のゴールド（実測 #F4AB1D〜#D49748）
     セカンダリ = サイトCSSの深緑 rgb(63,118,82)
     質感 = フラット（影を使わない）・ヘアライン・小さい角丸・英字はワイドトラッキング
   ============================================================ */
:root {
  --ink: #1d1d1d; --ink-2: #2f2e2e; --muted: #6e6e6d; --faint: #8f8f8f;
  --bg: #f6f6f4; --panel: #ffffff; --line: #e2e2e2; --line-strong: #c9c9c6;
  --gold: #c98b1e; --gold-bright: #e8a01c; --gold-soft: #fbf3e2;
  --green: #3f7652; --green-soft: #edf3ef;
  --sel: #1d1d1d; --sel-ink: #ffffff;
  --radius: 4px; --radius-sm: 3px;
  --latin: "Avenir Next", Futura, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f2f1ee; --ink-2: #e6e4e0; --muted: #a9a7a2; --faint: #85837e;
    --bg: #131312; --panel: #1e1e1c; --line: #34332f; --line-strong: #4a4844;
    --gold: #e2a93c; --gold-bright: #f0b64a; --gold-soft: #32291a;
    --green: #5da77c; --green-soft: #1a231d;
    --sel: #f2f1ee; --sel-ink: #17170f;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px; line-height: 1.5; padding: 12px 10px 24px; max-width: 700px; margin: 0 auto;
  overflow-x: hidden; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }

/* ---- ブランドロックアップ（A4L | ATHLETE FOR LIFE の組み） ---- */
.topline { display: flex; align-items: center; gap: 10px; padding: 2px 2px 10px; }
.brand { display: flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink); }
.brand .mark { font-family: var(--latin); font-size: 21px; font-weight: 800; letter-spacing: .01em; line-height: 1; }
.brand .rule { width: 1px; height: 22px; background: var(--line-strong); }
.brand .sub { font-family: var(--latin); font-size: 6.5px; font-weight: 700; letter-spacing: .3em; line-height: 1.45; color: var(--muted); }
.meta-line { flex: 1; min-width: 0; font-size: 11px; color: var(--muted); letter-spacing: .02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-family: var(--latin); background: var(--ink); color: var(--panel); border-radius: 2px;
  padding: 3px 7px; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; }
.topline button.scorer { padding: 5px 9px; font-size: 10.5px; letter-spacing: .04em; border-radius: 2px; font-weight: 700; }
.topline button.scorer.unset { color: var(--gold); border-color: var(--gold); }
.sub { color: var(--muted); font-size: 12px; padding: 6px 2px 0; line-height: 1.6; }

/* ---- ヘッダ（イニング・カウント・イニングスコア） ---- */
.header { padding: 10px 12px 8px; position: sticky; top: 0; z-index: 20; }
.hd-top { display: flex; align-items: center; gap: 16px; padding: 0 1px 8px; }
.st-inning { display: flex; align-items: baseline; gap: 2px; }
.st-num { font-family: var(--latin); font-size: 30px; font-weight: 800; line-height: .9; letter-spacing: -.02em; }
.st-half { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
.st-count { display: flex; gap: 16px; }
.st-final { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .16em; font-family: var(--latin); text-transform: uppercase; }
.cnt { display: flex; align-items: center; gap: 5px; }
.cnt .lbl { font-family: var(--latin); font-size: 10px; font-weight: 800; color: var(--faint); letter-spacing: .1em; }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line-strong); }
.dot.b.on { background: var(--green); border-color: var(--green); }
.dot.s.on { background: var(--gold); border-color: var(--gold); }
.dot.o.on { background: var(--ink); border-color: var(--ink); }

.mini-line { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mini-line th, .mini-line td { padding: 3px 0; text-align: center; border: none; }
.mini-line thead th { font-family: var(--latin); font-size: 9.5px; color: var(--faint); font-weight: 700; letter-spacing: .06em; }
.mini-line thead { border-bottom: 1px solid var(--line); }
.mini-line .tname { text-align: left; font-weight: 700; font-size: 12px; letter-spacing: .01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
.mini-line tbody tr + tr { border-top: 1px solid var(--line); }
.mini-line tbody tr.batting .tname::before { content: ""; display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--gold-bright); margin-right: 6px; vertical-align: middle; }
.mini-line .inn.now { background: var(--gold-soft); font-weight: 800; }
.mini-line .rh { width: 9%; font-weight: 700; border-left: 1px solid var(--line); }
.mini-line .rh.runs { font-family: var(--latin); font-size: 16px; font-weight: 800; }

/* ---- 状況カード ---- */
.situation { display: flex; align-items: center; gap: 14px; padding: 12px; }
.diamond { width: 84px; height: 76px; flex-shrink: 0; }
.diamond.big { width: 96px; height: 88px; }
.diamond .dpath { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.diamond .base { fill: var(--panel); stroke: var(--line-strong); stroke-width: 2; }
.diamond .base.on { fill: var(--gold-bright); stroke: var(--gold-bright); }
.diamond .base.home { fill: var(--line); stroke: var(--line-strong); stroke-width: 1.5; }
.diamond .runner-name { font-size: 11px; font-weight: 700; fill: var(--muted); }
.sit-main { flex: 1; min-width: 0; }
.batter-line { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.chip { font-family: var(--latin); font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 2px; padding: 2px 5px; }
.batter-name { font-size: 20px; font-weight: 700; letter-spacing: .01em; }

/* ---- 配球ストリップ ---- */
.strip { display: flex; align-items: center; gap: 7px; padding: 9px 12px; flex-wrap: wrap; min-height: 40px; }
.strip-label { font-family: var(--latin); font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint); }
.pbadge { display: inline-flex; align-items: center; gap: 4px; border: 1px solid; border-radius: 2px;
  padding: 3px 7px; font-size: 12.5px; font-weight: 700; }
.pbadge .pno { font-family: var(--latin); font-size: 9px; opacity: .65; }
.pbadge .ptag, .pbadge .pzone { font-size: 9.5px; font-weight: 700; opacity: .75; }
.pbadge .pzone { border-left: 1px solid currentColor; padding-left: 4px; }
.pbadge.s { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.pbadge.b { color: var(--green); border-color: var(--green); background: var(--green-soft); }
.pbadge.f { color: var(--muted); border-color: var(--line-strong); background: var(--bg); }

/* ---- タブ ---- */
.input-card { padding: 0 0 14px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tab { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0;
  padding: 14px 4px; font-size: 14px; font-weight: 700; letter-spacing: .06em; color: var(--faint); cursor: pointer; }
.tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.pane { padding: 12px 12px 0; }

/* ---- ボタン（フラット・ヘアライン・選択は黒ベタ） ---- */
button {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); padding: 12px 8px; cursor: pointer; font-weight: 700; letter-spacing: .02em;
  transition: background .12s ease, color .12s ease;
}
button:active { background: var(--bg); }
button:disabled { opacity: .3; cursor: not-allowed; }
button.big { padding: 21px 10px; font-size: 17px; letter-spacing: .04em; }
button.wide { width: 100%; margin-top: 8px; }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--panel); }
button.hot { color: var(--gold); border-color: var(--gold); }
button.cool { color: var(--green); border-color: var(--green); }
button.sel { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
button.ghost { background: transparent; border-color: var(--line); }
button.res { padding: 15px 6px; font-size: 14.5px; }
button.res.hit { border-color: var(--ink); }
button.res.out { border-color: var(--line); color: var(--muted); }
button.res.other { border-color: var(--line); color: var(--muted); }
button.small-link { padding: 10px 6px; font-size: 11.5px; letter-spacing: .06em; color: var(--muted);
  border-style: dashed; border-color: var(--line); }
.grid { display: grid; gap: 8px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.pad { margin-top: 10px; }

/* ---- セグメント（かんたん/コース・見逃し/空振り/ファウル） ---- */
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg.small { margin-top: 10px; }
.seg-btn { flex: 1; background: transparent; border: none; border-radius: 0; padding: 11px 6px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn.on { background: var(--ink); color: var(--panel); }

/* ---- 球種 ---- */
.ptype { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
.ptype-label { font-family: var(--latin); font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint); margin-right: 3px; }
.ptype-btn { padding: 7px 11px; font-size: 12px; border-radius: 2px; font-weight: 700; }
.ptype-btn.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }

/* ---- 5×5 コースグリッド ---- */
.zone { margin: 14px auto 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; max-width: 320px; }
.zcell { aspect-ratio: 1 / 1; padding: 0; border-radius: 2px; background: var(--panel);
  border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; }
.zcell.strike { background: var(--gold-soft); border: 1px solid var(--gold); }
.zcell .znum { font-family: var(--latin); font-size: 10.5px; font-weight: 700; color: var(--faint); }
.zcell.strike .znum { color: var(--gold); }

/* ---- 固定フッタ ---- */
.footbar { position: sticky; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); margin-bottom: 8px; }
.footbar button { padding: 12px 4px; font-size: 12px; letter-spacing: .04em; }

/* ---- セクション・表 ---- */
.section { padding: 0; }
.section h2 { font-size: 13px; margin: 0; padding: 14px 14px 8px; letter-spacing: .06em; font-weight: 700; }
.section h2 + .scroll-x, .section h2 + div { border-top: 1px solid var(--line); padding-top: 10px; }
.collapse-head { width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: transparent; border: none; border-radius: var(--radius); padding: 14px;
  font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.collapse-head .caret { color: var(--faint); font-weight: 700; }
.section > .scroll-x, .section > div { padding: 0 12px 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-family: var(--latin); color: var(--faint); font-weight: 700; font-size: 10px; letter-spacing: .1em; }
td.sum { font-weight: 800; }
tfoot td { color: var(--muted); font-size: 11.5px; }
.recap { white-space: pre-wrap; line-height: 1.9; font-size: 14.5px; }
.scroll-x { overflow-x: auto; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); }
.metric { background: var(--panel); padding: 9px 10px; }
.metric .k { font-size: 10px; color: var(--muted); letter-spacing: .02em; }
.metric .v { font-family: var(--latin); font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
textarea { width: 100%; max-width: 100%; margin-top: 10px; font-size: 10.5px; border-radius: 2px;
  border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 8px; }
input[type=number], input[type=text] { font: inherit; padding: 11px; border-radius: 2px;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); }
input[type=number] { width: 100px; }
input[type=text] { width: 100%; }

/* ---- タグ・バナー・シート ---- */
.tag-sub { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.tagbody { padding: 0 12px 14px; }
.tagbody .chips button { padding: 9px 12px; font-size: 13px; }
.tagfold .collapse-head { color: var(--muted); font-size: 12px; }
.banner { padding: 10px 12px; border-radius: 2px; margin-bottom: 8px; font-size: 13px; font-weight: 700;
  border-left: 3px solid; }
.banner.err { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--gold); }
.banner.ok { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-left: 3px solid var(--green); }
.banner.warn { background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); }
.sheet-bg { position: fixed; inset: 0; background: rgba(20,20,18,.55); display: flex; align-items: flex-end;
  justify-content: center; z-index: 60; }
.sheet { background: var(--panel); border-top: 2px solid var(--ink); border-radius: 0; padding: 18px 16px;
  width: 100%; max-width: 700px; max-height: 90vh; overflow: auto; }
.sheet h2 { margin: 0 0 12px; font-size: 15px; padding: 0; letter-spacing: .04em; }
.row-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin: 14px 0 6px; }
.eyebrow { font-family: var(--latin); font-size: 9.5px; color: var(--faint); font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 10px 13px; font-size: 13.5px; border-radius: 2px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
.sheet-actions button { flex: 1; padding: 14px 8px; letter-spacing: .06em; }
footer { color: var(--faint); font-size: 10px; text-align: center; padding: 14px 0 4px;
  letter-spacing: .1em; font-family: var(--latin); }

/* 指で押す部分は最低44px（Appleのヒューマンインターフェース指針） */
button.big, button.res, .tab, .footbar button, .seg-btn { min-height: 44px; }
.zcell { min-height: 40px; }

/* ---- スマホ（iPhone 390pt / Android 360dp） ---- */
@media (max-width: 430px) {
  body { padding: 10px 8px 20px; font-size: 15px; }
  .brand .mark { font-size: 18px; }
  .brand .sub { font-size: 6px; letter-spacing: .26em; }
  .meta-line { font-size: 10px; }
  .st-num { font-size: 26px; }
  .st-count { gap: 10px; }
  .mini-line { font-size: 11.5px; }
  .mini-line .tname { font-size: 10.5px; }
  .situation { gap: 10px; padding: 10px; }
  .diamond.big { width: 84px; height: 78px; }
  .batter-name { font-size: 18px; }
  .tab { font-size: 13px; }
  .pane { padding: 10px 10px 0; }
  button.big { padding: 18px 8px; font-size: 16px; }
  button.res { padding: 14px 4px; font-size: 13.5px; }
  .zone { max-width: 100%; }
  .ptype-btn { padding: 6px 9px; font-size: 11.5px; }
  .metrics { grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }
  .footbar button { font-size: 11px; }
}

/* ---- MVPの器（ナビゲーションと一覧） ---- */
.shellnav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin-bottom: 10px;
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.navbtn { background: transparent; border: none; border-radius: 0; padding: 12px 2px; font-size: 12px;
  font-weight: 700; letter-spacing: .02em; color: var(--muted); min-height: 44px; }
.navbtn + .navbtn { border-left: 1px solid var(--line); }
.navbtn.active { background: var(--ink); color: var(--panel); }
.gamerow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.gamerow:first-child { border-top: none; }
.g-main { flex: 1; min-width: 0; }
.g-title { font-weight: 700; font-size: 14px; }
.g-act { display: flex; gap: 6px; flex-shrink: 0; }
.g-act button { padding: 9px 11px; font-size: 12px; }
.consent-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.consent-row button { padding: 7px 12px; font-size: 12px; border-radius: 2px; }
tr.undone td { color: var(--faint); text-decoration: line-through; }
@media (max-width: 430px) {
  .shellnav { grid-template-columns: repeat(3, 1fr); }
  .navbtn:nth-child(n+4) { border-top: 1px solid var(--line); }
  .navbtn:nth-child(4) { border-left: none; }
  .g-title { font-size: 13px; }
}

</style>
</head>

          }))));
        }
        body.append(el2("div", { class: "grid g2 pad" }, [
          el2("button", { class: "ghost", text: "やめる", onclick: () => {
            teamDraft = null;
            render();
          } }),
          el2("button", { class: "primary", text: "保存する", disabled: !built, onclick: () => {
            upsertTeam(built);
            msg = `${built.name} を保存しました`;
            teamDraft = null;
            render();
          } })
        ]));
        wrap.append(el2("div", { class: "card section" }, [el2("h2", { text: "チームの登録・編集" }), body]));
        return wrap;
      }
      wrap.append(el2("div", { class: "card section" }, [
        el2("h2", { text: `チーム（${list.length}）` }),
        el2("div", {}, [
          el2("div", { class: "sub", text: "大会に出るチームを登録します。選手名は貼り付けで取り込めます（Excelのコピペ可）" }),
          el2("button", { class: "primary wide", text: "チームを追加", onclick: () => {
            teamDraft = { teamId: newTeamId(), name: "", text: "", pitcherId: null };
            render();
          } })
        ])
      ]));
      for (const t of list) {
        const sum = consentSummary(t, consents);
        const rows = el2("div");
        for (const p of [...t.players, ...t.bench ?? []]) {
          const ok = isConsented(consents, p.id);
          rows.append(el2("div", { class: "consent-row" }, [
            el2("span", { text: `#${p.number ?? "-"} ${p.name}` }),
            el2("button", {
              class: ok ? "sel" : "",
              text: ok ? "同意あり" : "未確認",
              onclick: () => {
                saveConsents(setConsent(consents, p.id, !ok));
                render();
              }
            })
          ]));
        }
        wrap.append(el2("div", { class: "card section" }, [
          el2("h2", { text: `${t.name}${t.isSample ? "（見本）" : ""}（${t.players.length}人＋控え${(t.bench ?? []).length}／保護者同意 ${sum.consented}/${sum.total}）` }),
          el2("div", {}, [
            sum.pending ? el2("div", { class: "sub", text: `同意 未確認: ${pendingPlayers(t, consents).map((p) => `#${p.number}`).join(" ")}（共有時は氏名を出しません）` }) : null,
            rows,
            el2("div", { class: "grid g2 pad" }, [
              el2("button", { text: "名簿を編集", onclick: () => {
                teamDraft = { teamId: t.teamId, name: t.name, text: teamToText(t), pitcherId: t.pitcherId };
                render();
              } }),
              el2("button", { class: "ghost", text: "削除", onclick: () => {
                if (!confirmDelete(`team:${t.teamId}`)) return;
                removeTeam(t.teamId);
                msg = `${t.name} を削除しました`;
                render();
              } })
            ])
          ])
        ]));
      }
      wrap.append(entryCard());
      return wrap;
    }
    function entryCard() {
      const pool = loadPool();
      const sum = entrySummary(pool);
      const body = el2("div");
      body.append(el2("div", { class: "sub", text: `申込 ${sum.applied}／承認 ${sum.approved}／編成済 ${sum.assigned}／却下 ${sum.rejected}　（合計 ${sum.total}人）` }));
      body.append(el2("div", { class: "row-label", text: "氏名（必須）" }));
      body.append(el2("input", {
        type: "text",
        value: entryForm.name,
        placeholder: "例: 佐藤健二",
        oninput: (e) => {
          entryForm.name = e.target.value;
        }
      }));
      body.append(el2("div", { class: "grid g2 pad" }, [
        el2("input", {
          type: "text",
          value: entryForm.grade,
          placeholder: "学年（任意・例 中2）",
          oninput: (e) => {
            entryForm.grade = e.target.value;
          }
        }),
        el2("input", {
          type: "text",
          value: entryForm.position,
          placeholder: "希望ポジション（任意・例 投）",
          oninput: (e) => {
            entryForm.position = e.target.value;
          }
        })
      ]));
      body.append(el2("button", { class: "primary wide", text: "この選手を申込に追加", onclick: () => {
        try {
          const r = applyEntry(pool, { name: entryForm.name, grade: entryForm.grade, position: entryForm.position });
          savePool(r.pool);
          entryForm = { name: "", grade: "", position: "" };
          msg = `${r.entry.name} を申込に追加しました`;
        } catch (e) {
          msg = e instanceof EntryError ? e.message : `追加できませんでした（${e.message}）`;
        }
        render();
      } }));
      const save = (next, message) => {
        savePool(next);
        msg = message;
        render();
      };
      const teamName = (id) => teams().find((t) => t.teamId === id)?.name ?? id;
      for (const e of pool) {
        const label = `${e.name}${e.grade ? `（${e.grade}）` : ""}${e.position ? ` 希望:${e.position}` : ""}`;
        const ops = el2("div", { class: "chips" });
        if (e.status === ENTRY_STATUS.APPLIED || e.status === ENTRY_STATUS.REJECTED) {
          ops.append(el2("button", { text: "承認", onclick: () => save(approveEntry(pool, e.id), `${e.name} を承認しました`) }));
        }
        if (e.status !== ENTRY_STATUS.REJECTED) {
          ops.append(el2("button", {
            class: "ghost",
            text: "却下",
            onclick: () => save(rejectEntry(pool, e.id, "主催者判断"), `${e.name} を却下しました`)
          }));
        }
        if (e.status === ENTRY_STATUS.ASSIGNED) {
          ops.append(el2("button", {
            class: "ghost",
            text: "編成を外す",
            onclick: () => save(unassign(pool, e.id), `${e.name} の編成を外しました`)
          }));
        }
        const state = e.status === ENTRY_STATUS.ASSIGNED ? `${teamName(e.teamId)} #${e.number}` : e.status === ENTRY_STATUS.APPROVED ? "承認済み" : e.status === ENTRY_STATUS.REJECTED ? `却下（${e.rejectReason ?? "理由なし"}）` : "申込";
        body.append(el2("div", { class: "consent-row" }, [el2("span", { text: `${label} — ${state}` })]));
        body.append(ops);
      }
      const ids = teams().map((t) => t.teamId);
      if (sum.approved > 0 && ids.length > 0) {
        body.append(el2("button", {
          class: "wide",
          text: `承認済み ${sum.approved}人を登録チーム${ids.length}つに振り分ける`,
          onclick: () => save(autoAssign(pool, ids), `${sum.approved}人を振り分けました`)
        }));
      }
      if (sum.assigned > 0) {
        body.append(el2("div", { class: "row-label", text: "編成結果をチーム名簿に反映する" }));
        for (const id of [...new Set(pool.filter((e) => e.status === ENTRY_STATUS.ASSIGNED).map((e) => e.teamId))]) {
          const r = toRoster(pool, id, teamName(id));
          body.append(el2("button", {
            class: "ghost wide",
            disabled: r.shortage > 0,
            text: r.shortage > 0 ? `${teamName(id)}: あと${r.shortage}人必要（いま${r.players.length}人）` : `${teamName(id)} の名簿を作る（${r.players.length}人＋控え${r.bench.length}）`,
            onclick: () => {
              upsertTeam({ ...r, name: teamName(id) });
              msg = `${teamName(id)} の名簿を個人参加の編成から作りました`;
              render();
            }
          }));
        }
      }
      if (!ids.length) {
        body.append(el2("div", { class: "banner warn", text: "先にチームを1つ以上登録すると、振り分けができます" }));
      }
      return el2("div", { class: "card section" }, [el2("h2", { text: "個人参加のエントリー" }), body]);
    }
    function syncCard() {
      const url = serverUrl();
      const last = lastSync();
      const body = el2("div");
      body.append(el2("div", { class: "sub", text: url ? "同期先が設定されています。オフラインでもアプリはそのまま使えます（つながった時にまとめて合流します）" : "同期先は未設定です。この端末だけで完結して動きます。設定するまで外部への通信は一切行いません" }));
      body.append(el2("div", { class: "banner warn", text: "PoC中は仮データだけを入れてください。実在の選手の氏名・連絡先は入れないでください" }));
      body.append(el2("div", { class: "row-label", text: "同期サーバのアドレス" }));
      const input = el2("input", { type: "text", value: url, placeholder: "例: http://192.168.1.10:8932" });
      body.append(input);
      body.append(el2("div", { class: "row-label", text: "大会の合言葉" }));
      const tokenInput = el2("input", { type: "password", value: syncToken(), placeholder: "主催者から渡された合言葉" });
      body.append(tokenInput);
      body.append(el2("div", { class: "sub", text: "合言葉を知っている端末だけがつながります。この端末の中に保存されます" }));
      body.append(el2("div", { class: "grid g2 pad" }, [
        el2("button", { text: "保存", onclick: () => {
          const v = setServerUrl(input.value);
          setSyncToken(tokenInput.value);
          msg = v ? `同期先を ${v} にしました` : "同期先を未設定に戻しました";
          syncResult = null;
          render();
        } }),
        el2("button", {
          class: "primary",
          text: syncBusy ? "同期中…" : "いま同期する",
          disabled: syncBusy || !url,
          onclick: async () => {
            syncBusy = true;
            syncResult = null;
            render();
            const r = await syncNow({
              snapshot: currentSnapshot(),
              applyMerged: (merged) => applySnapshot(merged)
            });
            syncBusy = false;
            syncResult = r.ok ? `${r.message}：${describeReport(r.report)}` : r.message;
            render();
          }
        })
      ]));
      if (last) body.append(el2("div", { class: "sub", text: `最後に同期できたのは ${new Date(last).toLocaleString("ja-JP")}` }));
      if (syncResult) body.append(el2("div", { class: "banner ok", text: syncResult }));
      return el2("div", { class: "card section" }, [el2("h2", { text: "同期" }), body]);
    }
    function download(name, text) {
      try {
        const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
        const a = el2("a", { href: url, download: name });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1e3);
        msg = `保存しました: ${name}`;
      } catch (e) {
        msg = `保存に失敗しました（${e.message}）`;
      }
      render();
    }
    function render() {
      root.textContent = "";
      root.append(el2("div", { class: "topline" }, [
        el2("div", { class: "brand" }, [
          el2("span", { class: "mark", text: "A4L" }),
          el2("span", { class: "rule" }),
          el2("span", { class: "sub" }, [el2("div", { text: "ATHLETE" }), el2("div", { text: "FOR" }), el2("div", { text: "LIFE" })])
        ]),
        el2("span", { class: "meta-line", text: `${gameInfo().title || ""}　${currentGameId() ?? ""}` })
      ]));
      root.append(el2("nav", { class: "shellnav" }, NAV.map(([key, label]) => el2("button", {
        class: `navbtn${view === key ? " active" : ""}`,
        text: label,
        onclick: () => {
          view = key;
          msg = null;
          pendingDelete = null;
          render();
        }
      }))));
      if (msg) root.append(el2("div", { class: "banner ok", text: msg }));
      if (view === "score") {
        const gid = currentGameId();
        if (!gid) {
          root.append(el2("div", { class: "card section" }, [
            el2("h2", { text: "入力する試合がありません" }),
            el2("div", {}, [
              el2("div", { class: "sub", text: "「試合」タブで試合を作成してください" }),
              el2("button", { class: "wide primary", text: "試合を作る", onclick: () => {
                view = "home";
                render();
              } })
            ])
          ]));
          return;
        }
        const holder = el2("div");
        root.append(holder);
        mountApp(holder, {
          rosters: rosters(),
          gameInfo: { ...gameInfo(), gameId: gid },
          isDemo: isDemo(),
          setupKey: "a4l:v1:setup",
          showBrand: false,
          allowRosterEdit: false,
          onSetupSaved: () => {
            if (typeof onReload === "function") onReload();
            else render();
          }
        });
        return;
      }
      root.append(view === "home" ? homeView() : view === "season" ? seasonView() : view === "audit" ? auditView() : view === "share" ? shareView() : view === "import" ? importView() : view === "voice" ? voiceView() : teamsView());
    }
    migrateTeamsFromSetup(demoRosters);
    render();
  }

  // app.js
  mountShell(document.getElementById("app"), {
    demoRosters: ROSTERS,
    demoGameInfo: GAME_INFO,
    onReload: () => location.reload()
    // 名簿・大会データを入れ替えたら読み直す（選手IDが変わるため）
  });
})();

</script>
</body>
</html>
